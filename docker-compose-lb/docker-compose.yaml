version: '3.8'

services:
  nginx:
    image: nginx:latest
    container_name: nginx-lb
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - tomcat1
      - tomcat2
      - tomcat3

  tomcat1:
    image: tomcat:9.0
    container_name: tomcat1
    volumes:
      - ./tomcat9:/usr/local/tomcat/webapps/ROOT
    
  tomcat2:
    image: tomcat:10.0
    container_name: tomcat2
    volumes:
      - ./tomcat10:/usr/local/tomcat/webapps/ROOT
    
  tomcat3:
    image: tomcat:11.0
    container_name: tomcat3
    volumes:
      - ./tomcat11:/usr/local/tomcat/webapps/ROOT
    
